<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile – ApniDukaan</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-shell {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-title {
      width: 100%;
      max-width: 1200px;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin: 24px 0 16px;
      letter-spacing: -0.5px;
    }
    .profile-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 768px) {
      .profile-grid { grid-template-columns: 1fr; }
    }
    .profile-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a7bff, #61e4f8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .profile-info { display: flex; flex-direction: column; gap: 4px; }
    .profile-name  { font-size: 20px; font-weight: 700; color: #fff; }
    .profile-email { font-size: 13px; color: rgba(255,255,255,0.55); }
    .profile-phone { font-size: 13px; color: rgba(255,255,255,0.55); }
    .btn-edit {
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(58,123,255,0.2);
      border: 1px solid rgba(58,123,255,0.4);
      color: #5b9bff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-start;
    }
    .btn-edit:hover { background: rgba(58,123,255,0.35); }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .address-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .address-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
    .address-text  { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.7; }
    .btn-small {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-start;
    }
    .btn-small:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .mini-order {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .mini-order-id { font-family: monospace; font-size: 13px; font-weight: 600; color: #fff; }
    .mini-order-date { font-size: 12px; color: rgba(255,255,255,0.45); }
    .mini-order-total { font-size: 14px; font-weight: 700; color: #fff; }
    .mini-order-status {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .mini-order-status.completed  { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .mini-order-status.pending    { background: rgba(255,193,7,0.15);  color: #ffc107; }
    .mini-order-status.processing { background: rgba(58,123,255,0.2);  color: #5b9bff; }
    .mini-order-status.cancelled  { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }
    .settings-row:last-child { border-bottom: none; }
    .danger-zone { color: #ff6b6b; }
    .btn-danger {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,107,107,0.15);
      border: 1px solid rgba(255,107,107,0.3);
      color: #ff6b6b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover { background: rgba(255,107,107,0.3); }
    .divider-glow {
      width: 100%;
      max-width: 1200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(97,228,248,0.3), transparent);
      margin: 16px 0;
    }
    /* Modal inputs override */
    .modal-content input,
    .modal-content textarea,
    .modal-content select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border 0.2s;
    }
    .modal-content input:focus,
    .modal-content textarea:focus,
    .modal-content select:focus {
      border-color: #3a7bff;
      box-shadow: 0 0 0 3px rgba(58,123,255,0.18);
    }
    .modal-content input::placeholder,
    .modal-content textarea::placeholder { color: rgba(255,255,255,0.35); }
    .modal-content label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .modal-content select option { background: #0a0f1f; color: #fff; }
  </style>
</head>

<body>
  <div class="profile-shell">

    <!-- NAVBAR -->
    <div class="navbar" style="max-width:1200px; width:100%;">
      <div class="nav-left">
        <div class="logo">ApniDukaan</div>
        <div class="nav-links">
          <div class="nav-link" onclick="window.location.href='index.html'">Shop</div>
          <div class="nav-link" onclick="window.location.href='orders.html'">Orders</div>
          <div class="nav-link nav-link-active">Profile</div>
        </div>
      </div>
      <div class="nav-right" id="navRight">
        <!-- User info injected by JS -->
      </div>
    </div>

    <div class="divider-glow"></div>

    <div class="profile-title">Your Profile</div>

    <!-- GRID LAYOUT -->
    <div class="profile-grid">

      <!-- USER INFORMATION -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="avatar" id="userAvatar">?</div>
          <div class="profile-info">
            <div class="profile-name" id="profileName">Loading...</div>
            <div class="profile-email" id="profileEmail"></div>
            <div class="profile-phone" id="profilePhone"></div>
          </div>
        </div>
        <button class="btn-edit">Edit Profile</button>
      </div>

      <!-- ADDRESS SECTION -->
      <div class="profile-card">
        <div class="section-title">Your Address</div>
        <div class="address-block">
          <div class="address-title">Default Address</div>
          <div class="address-text" id="addressText">Not set yet.</div>
        </div>
        <button class="btn-small">Add / Edit Address</button>
      </div>

      <!-- RECENT ORDERS -->
      <div class="profile-card" id="recentOrdersCard">
        <div class="section-title">Recent Orders</div>
        <div style="color: rgba(255,255,255,0.4); font-size:13px; padding: 8px 0;">Loading orders...</div>
        <button class="btn-small" onclick="window.location.href='orders.html'">View All Orders</button>
      </div>

      <!-- ACCOUNT SETTINGS -->
      <div class="profile-card">
        <div class="section-title">Account Settings</div>
        <div class="settings-row">
          <div>Change Password</div>
          <button class="btn-ghost">Update</button>
        </div>
        <div class="settings-row">
          <div>Email Notifications</div>
          <button class="btn-ghost">Manage</button>
        </div>
        <div class="settings-row danger-zone">
          <div>Delete Account</div>
          <button class="btn-danger">Delete</button>
        </div>
      </div>

    </div>

  </div>

  <script src="profile.js"></script>
</body>

</html>
