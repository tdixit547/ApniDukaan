<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Your Orders - ApniDukaan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="View and track all your ApniDukaan orders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="orders.css" />
</head>

<body>
  <div class="page">
    <div class="customer-portal">

      <!-- ========== NAVBAR ========== -->
      <div class="navbar">
        <div class="nav-left">
          <div class="logo">ApniDukaan</div>
          <div class="nav-links">
            <a href="index.html" class="nav-link">Shop</a>
            <a href="orders.html" class="nav-link nav-link-active">Orders</a>
            <a href="profile.html" class="nav-link">Profile</a>
          </div>
        </div>
        <div class="nav-right" id="navRight">
          <!-- Auth buttons injected by JS -->
        </div>
      </div>

      <!-- ========== GLOWING DIVIDER ========== -->
      <div class="main-placeholder"></div>

      <!-- ========== PAGE HEADER ========== -->
      <div style="margin: 8px 0 4px;">
        <h1 style="font-size:28px; font-weight:800; color:#fff; margin:0;">Your Orders</h1>
        <p style="font-size:14px; color:rgba(255,255,255,0.5); margin:6px 0 0;">Track and manage all your purchases</p>
      </div>

      <!-- ========== ORDER LIST ========== -->
      <div id="ordersContainer" style="display:flex; flex-direction:column; gap:20px; margin-top:8px;">
        <!-- Orders injected by JS -->
        <div class="empty-state">
          <div class="empty-state-icon">📦</div>
          <div class="empty-state-title">Loading your orders…</div>
        </div>
      </div>

      <!-- ========== FOOTER ========== -->
      <div class="footer">
        <div class="footer-left">© 2025 ApniDukaan. All rights reserved.</div>
        <div class="footer-right">
          <span>Help</span>
          <span>Returns</span>
          <span>Terms</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Floating Help Button -->
  <a href="about.html" class="help-button" title="Help & About">?</a>

  <script src="orders.js"></script>
</body>

</html>
